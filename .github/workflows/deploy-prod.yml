name: Deploy Prod

on:
  push:
    branches: [main-prod]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/bun-task-manager-cosmos-project
            git pull origin main-prod
            docker build -t bun-task-manager .
            docker stop bun-task-manager || true
            docker rm bun-task-manager || true
            docker run -d --name bun-task-manager -p 3005:3005 bun-task-manager